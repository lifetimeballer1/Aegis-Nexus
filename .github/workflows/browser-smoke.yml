name: Global Pulse — Browser Smoke Tests

on:
  push:
    paths:
      - 'index.html'
      - 'intelligence-web.html'
      - '*.js'
      - '*.css'
      - 'js/**'
      - 'css/**'
      - 'data/**'
      - '.github/workflows/browser-smoke.yml'
      - 'tests/intelligence_web_smoke.py'
      - 'tests/dashboard_smoke.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-pulse-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMOKE_BASE_URL: http://127.0.0.1:4173/Aegis-Nexus
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Start local production server
        run: |
          mkdir -p /tmp/aegis-smoke
          ln -s "$GITHUB_WORKSPACE" /tmp/aegis-smoke/Aegis-Nexus
          python -m http.server 4173 --directory /tmp/aegis-smoke --bind 127.0.0.1 >/tmp/global-pulse-http.log 2>&1 &
          echo $! >/tmp/global-pulse-http.pid
          sleep 2
      - name: Run desktop and mobile UI smoke tests
        run: python tests/dashboard_smoke.py
      - name: Verify Intelligence Web rendering and boot failure
        run: python tests/intelligence_web_smoke.py
      - name: Upload Intelligence Web screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-web-rendering
          path: artifacts/intelligence-web
      - name: Stop local server
        if: always()
        run: kill "$(cat /tmp/global-pulse-http.pid)" 2>/dev/null || true
