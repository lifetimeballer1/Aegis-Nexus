name: Global Pulse — Evidence Coverage

# Conflict/OSINT coverage is now part of the canonical refresh pipeline.
# This workflow is retained only as a manual recovery tool so it cannot race
# the live refresh or create skipped duplicate runs.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aegis-nexus-canonical-refresh
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build evidence-driven conflict and OSINT coverage
        run: python update_conflict_coverage.py
      - name: Validate coverage output
        run: |
          set -euo pipefail
          python -m py_compile update_conflict_coverage.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/snapshot.json').read_text(encoding='utf-8'))
          os=d.get('osintMaps') or {}
          assert os.get('version') in (2,3,4), f"unsupported OSINT schema: {os.get('version')}"
          assert isinstance(os.get('normalizedPoints',[]),list)
          assert isinstance(os.get('regionalPoints',[]),list)
          markers=d.get('markers',[])
          assert isinstance(markers,list) and markers, 'canonical map has no markers'
          print('VALID COVERAGE:',os.get('version'),'markers=',len(markers))
          PY
      - name: Publish coverage snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshot.json
          if git diff --staged --quiet; then echo 'No coverage changes'; exit 0; fi
          git commit -m 'chore: refresh conflict and OSINT map coverage'
          git fetch origin main
          git rebase -X theirs origin/main
          git push origin HEAD:main
