name: Global Pulse — Change & Regional Intelligence
on:
  workflow_run:
    workflows: ["Aegis Nexus — Canonical Live Refresh"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: global-pulse-canonical-refresh
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build What Changed
        run: python build_what_changed.py
      - name: Build regional intelligence
        run: python build_regional_intelligence.py
      - name: Validate Phase 3 artifacts
        run: |
          set -euo pipefail
          python -m py_compile build_what_changed.py build_regional_intelligence.py
          python - <<'PY'
          import json
          from pathlib import Path
          wc=json.loads(Path('data/what_changed.json').read_text())
          rg=json.loads(Path('data/regional_intelligence.json').read_text())
          assert wc.get('version')==1 and isinstance(wc.get('items'),list)
          assert isinstance(wc.get('summary'),dict)
          assert len(rg.get('regions',{})) >= 8
          assert all(isinstance(v.get('reports'),int) and v.get('reports',0)>=0 for v in rg['regions'].values())
          assert len(rg.get('priorityOrder',[])) >= 8
          print('PHASE 3 VALIDATION PASSED')
          print('What changed:',wc['summary'])
          print('Regional priority:',rg['priorityOrder'])
          PY
      - name: Commit Phase 3 artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/what_changed.json data/regional_intelligence.json
          if git diff --staged --quiet; then echo 'No Phase 3 artifact changes'; exit 0; fi
          git commit -m 'feat: refresh change and regional intelligence'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
