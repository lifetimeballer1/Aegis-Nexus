name: Global Pulse — Map Event Links
on:
  workflow_run:
    workflows: ["Global Pulse — Canonical Live Refresh"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aegis-nexus-canonical-refresh
  cancel-in-progress: false
jobs:
  link:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python link_events_to_map.py
      - name: Validate map-event sidecar
        run: |
          python -m py_compile link_events_to_map.py
          python - <<'PY'
          import json
          d=json.load(open('data/map_event_links.json'))
          assert d.get('version')==1
          assert d.get('linkedMarkers',0) >= 0
          for x in d.get('links',[]):
              assert x.get('eventId') and x.get('lat') is not None and x.get('lng') is not None
          print('MAP EVENT LINK VALIDATION PASSED:',d.get('linkedMarkers'))
          PY
      - name: Commit sidecar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/map_event_links.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'feat: refresh map event links'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
