name: Deploy Global Pulse to GitHub Pages

# Manual emergency deployment only. The canonical refresh workflow owns normal
# production deployment and publishes the same minimal browser-only site shape.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aegis-nexus-canonical-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate current snapshot
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          d=json.loads(Path('data/snapshot.json').read_text())
          stamp=d.get('updatedAt'); assert stamp
          age=(datetime.now(timezone.utc)-datetime.fromisoformat(stamp.replace('Z','+00:00'))).total_seconds()
          assert -120 <= age <= 1800, f'snapshot stale or future-dated: {age:.0f}s'
          assert isinstance(d.get('markers'),list) and d['markers']
          print('MANUAL PAGES VALIDATION PASSED',stamp)
          PY
      - name: Install map precision layer
        run: python map_precision_photos.py
      - name: Prepare minimal browser site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --include='index.html' \
            --include='intelligence-web.html' \
            --include='site.webmanifest' \
            --include='favicon.png' \
            --include='apple-touch-icon.png' \
            --include='*.js' \
            --include='*.css' \
            --include='js/***' \
            --include='css/***' \
            --include='assets/***' \
            --include='data/***' \
            --exclude='*' \
            ./ _site/
          test -s _site/index.html
          test -s _site/data/snapshot.json
          test -s _site/data/map_points.json
          test ! -e _site/news_feed.db
          test ! -e _site/tests
          ! find _site -type f -name '*.py' -print -quit | grep -q .
          ! find _site -type d -name '__pycache__' -print -quit | grep -q .
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
