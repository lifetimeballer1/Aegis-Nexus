name: Global Pulse — Regional OSINT Recovery

# Regional OSINT is maintained as a manual recovery/diagnostic path.
# The canonical live refresh owns production refresh and GitHub Pages deployment.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aegis-nexus-canonical-refresh
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect regional OSINT
        run: python regional_osint_v2.py
      - name: Validate regional OSINT output
        run: |
          set -euo pipefail
          python -m py_compile regional_osint_v2.py update_conflict_coverage.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/snapshot.json').read_text(encoding='utf-8'))
          o=d.get('osintMaps') or {}
          counts=o.get('regionalCounts') or {}
          required={'Africa','South America','South Asia'}
          missing=required-set(counts)
          if missing: raise SystemExit(f'Missing regional counts: {sorted(missing)}')
          regional=o.get('regionalPoints') or []
          markers=[m for m in d.get('markers',[]) if m.get('layer')=='osint-regional']
          if not regional and not markers: raise SystemExit('No regional OSINT points were produced')
          for p in regional + markers:
              assert -90 <= float(p['lat']) <= 90 and -180 <= float(p['lng']) <= 180
              assert p.get('source') and p.get('observedAt')
              assert p.get('sourceUrl') or p.get('url')
          if sum(int(v or 0) for v in counts.values()) <= 0: raise SystemExit(f'Regional counts are all zero: {counts}')
          print('Regional recovery validation passed:', counts)
          PY
      - name: Publish recovery snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshot.json index.html
          if git diff --cached --quiet; then echo 'No regional OSINT changes.'; exit 0; fi
          git commit -m 'chore: refresh regional OSINT recovery data'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
