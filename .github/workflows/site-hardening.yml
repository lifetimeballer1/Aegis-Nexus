name: Global Pulse — Site Hardening

on:
  push:
    branches: [main]
    paths:
      - 'harden_site.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aegis-nexus-canonical-refresh
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply idempotent browser hardening
        run: python harden_site.py

      - name: Commit hardened site metadata
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --staged --quiet; then
            echo 'No site hardening changes required.'
            exit 0
          fi
          git commit -m 'chore: harden Global Pulse site metadata'
          git push origin HEAD:main
