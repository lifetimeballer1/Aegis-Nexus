name: Global Pulse — Source Health
on:
  workflow_run:
    workflows: ["Global Pulse — Canonical Live Refresh"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aegis-nexus-canonical-refresh
  cancel-in-progress: false
jobs:
  source-health:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build durable source health
        run: python build_source_health.py
      - name: Validate source health artifact
        run: |
          set -euo pipefail
          python -m py_compile build_source_health.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/source_health.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('version') == 2
          assert isinstance(d.get('sources'), list) and len(d['sources']) >= 20
          assert isinstance(d.get('summary'), dict)
          allowed={'online','failed'}
          content={'data_available','fallback_data_available','online_empty','unavailable'}
          for s in d['sources']:
              assert s.get('name') and s.get('status') in allowed
              assert s.get('contentStatus') in content
              assert s.get('lastChecked')
              assert isinstance(s.get('rowsFetched'), int) and s['rowsFetched'] >= 0
          assert d['summary'].get('onlineWithData',0) + d['summary'].get('onlineEmpty',0) == d['summary'].get('online',0)
          print('SOURCE HEALTH VALIDATION PASSED')
          PY
      - name: Commit source health telemetry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source_health.json
          if git diff --staged --quiet; then echo 'No source-health changes'; exit 0; fi
          git commit -m 'chore: refresh source health telemetry'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
