name: Aegis Nexus — Canonical Live Refresh
run-name: Aegis Nexus refresh • ${{ github.event_name }} • ${{ github.run_number }}
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-snapshot.yml'
      - 'refresh_pipeline.py'
      - 'news_feed_db.py'
      - 'validate_operational_health.py'
      - 'tests/test_*.py'
      - 'tests/intelligence_web_filters.test.cjs'
      - 'validate_*.py'
      - 'build_*.py'
      - 'update_*.py'
      - 'intelligence_entity_extractor.py'
      - 'intelligence_scoring.py'
      - 'intelligence_schema.py'
      - 'build_canonical_intelligence_v3.py'
      - 'enrich_semantic_relationships.py'
      - 'repair_strategic_targets.py'
      - 'repair_actor_target_roles.py'
      - 'trace_strategic_provenance.py'
      - 'ensure_major_power_nodes.py'
      - 'enrich_brain_actions.py'
      - 'global_pulse_*.js'
      - 'global_pulse_*.css'
      - 'js/**'
      - 'index.html'
      - 'intelligence-web.html'
      - 'intelligence_brain_web.js'
      - 'intelligence_web_runtime_guard.js'
      - 'intelligence_web_performance.js'
      - 'intelligence_web_v2.js'
      - 'intelligence_web_controls_fix.js'
      - 'intelligence_action_panel.js'
      - 'intelligence_action_flow.js'
      - 'data/enforcer_maps.json'
concurrency:
  group: aegis-nexus-canonical-refresh
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
env:
  PYTHONUNBUFFERED: '1'
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore latest news database
        uses: actions/cache@v4
        with:
          path: news_feed.db
          key: ${{ runner.os }}-aegis-nexus-news-db-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-aegis-nexus-news-db-
      - name: Verify runtime
        run: python --version && node --version && git --version
      - name: Run canonical refresh with per-stage verification
        run: python refresh_pipeline.py
      - name: Finalize map UI and browser cache bust
        run: python finalize_map_ui.py
      - name: Install regression test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run regression tests
        run: |
          set -euo pipefail
          python -m pytest -q
          python validate_data_resilience.py --require-manifest
      - name: Verify critical published inputs
        run: |
          set -euo pipefail
          python -m py_compile harden_site.py refresh_pipeline.py pipeline/build_snapshot.py build_what_changed.py update_market_data.py ensure_brain_groups.py build_intelligence_brain.py build_canonical_intelligence_v3.py enrich_semantic_relationships.py repair_strategic_targets.py repair_actor_target_roles.py trace_strategic_provenance.py enrich_brain_actions.py ensure_major_power_nodes.py validate_intelligence_brain.py validate_action_intelligence.py validate_data_resilience.py validate_security.py validate_performance.py validate_operational_health.py build_map_points.py finalize_map_ui.py update_brain_feedback.py update_feed_expansion.py merge_live_news.py build_live_events.py claim_intelligence.py build_source_evidence.py build_event_intelligence.py build_event_consistency.py build_event_resolution.py build_intelligence_assessment.py build_historical_trends.py brain_schema.py validate_brain_stories.py validate_brain_gap_history.py build_brain_stories.py build_tension.py validate_tension.py
          python validate_data_resilience.py
          python validate_intelligence_brain.py
          python validate_action_intelligence.py
          python validate_performance.py
          python validate_operational_health.py
          node --check intelligence_brain_web.js
          node --check intelligence_web_runtime_guard.js
          node --check intelligence_web_performance.js
          node --check js/intelligence_web_filters.js
          node --test tests/intelligence_web_filters.test.cjs
          node --check intelligence_web_v2.js
          node --check intelligence_web_controls_fix.js
          node --check intelligence_action_panel.js
          node --check intelligence_action_flow.js
          node --check global_pulse_performance.js
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          d=json.loads(Path('data/snapshot.json').read_text()); m=d.get('marketData',{}); s=d.get('stories',[])
          assert len(m.get('indicators',[])) >= 20
          assert any(float(x.get('price',0) or 0)>0 for x in m.get('indicators',[]) if isinstance(x,dict))
          assert d.get('updatedAt') and d.get('lastSuccessfulRefresh') and isinstance(s,list) and len(s)>0
          assert isinstance(d.get('failoverState'),dict) and (d.get('conflictDataset') or {}).get('provider') and (d.get('macroData') or {}).get('provider')
          brain=d.get('intelligenceBrain') or {}
          assert brain.get('complete') is True and brain.get('sourceBackedOnly') is True and brain.get('consolidated') is True
          assert int(brain.get('maxNodes',0)) == 35 and 10 <= len(brain.get('nodes',[])) <= 35 and len(brain.get('edges',brain.get('relationships',[]))) >= 5
          live=json.loads(Path('data/live_status.json').read_text()); assert live.get('rowsFetched',0)>0 and live.get('feedsChecked',0)>=20
          health=json.loads(Path('data/source_health.json').read_text()); summary=health.get('summary') or {}
          assert health.get('updatedAt') and int(health.get('feedsChecked',0)) >= 20 and int(health.get('rowsFetched',0)) > 0
          assert isinstance(health.get('sources'),list) and health['sources']
          assert int(summary.get('onlineWithData',0)) > 0
          canonical=json.loads(Path('data/canonical_intelligence.json').read_text())
          assert canonical.get('generated_at')
          assert isinstance(canonical.get('entities'),list) and len(canonical['entities']) > 0
          assert isinstance(canonical.get('evidence'),list) and len(canonical['evidence']) > 0
          mp=json.loads(Path('data/map_points.json').read_text()); assert isinstance(mp.get('markers'),list) and len(mp['markers'])>0
          assert all(-90<=float(x['lat'])<=90 and -180<=float(x['lng'])<=180 for x in mp['markers'])
          manifest=json.loads(Path('data/refresh_manifest.json').read_text())
          for name in ('snapshot.json','history.json','sources.json','live_articles.json','canonical_intelligence.json','intelligence_graph.json','intelligence_brain.json','map_points.json','strategic_signals.json','source_health.json'):
              meta=manifest['artifacts'][name]; assert hashlib.sha256(Path('data',name).read_bytes()).hexdigest()==meta['sha256']
          html=Path('index.html').read_text(); assert all(x in html for x in ('global_pulse_core.js','global_pulse_event_pipeline.js','global_pulse_brain_ui.js','global_pulse_tokens.css','global_pulse_performance.js'))
          assert 'Aegis Nexus' in html and 'section-brain' in html and 'section-markets' in html and 'mapContainer' in html and 'loading="lazy"' in html and 'loading="eager"' not in html
          web=Path('intelligence-web.html').read_text()
          for src in ('intelligence_web_runtime_guard.js?v=20260907-guard2','intelligence_web_performance.js?v=20260907-perf2','intelligence_web_v2.js?v=20260908-filters1','intelligence_web_controls_fix.js?v=20260907-controlsfix2','intelligence_action_flow.js?v=20260907-flow2'):
              assert src in web
          assert 'intelligence_semantic_layer.js' not in web
          renderer=Path('intelligence_web_v2.js').read_text(); assert 'const NODE_COLORS=' in renderer and "GRAPH='data/intelligence_graph.json'" in renderer and 'async function get(path)' in renderer and 'new ForceGraph3D' in renderer and 'function render()' in renderer
          print('PASS canonical data, source health, manifest, current Intelligence Web runtime integration and action attribution gate')
          PY
      - name: Commit generated data and UI
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'No generated changes to commit'; exit 0; fi
          git commit -m 'chore: refresh Aegis Nexus live data'
          for attempt in 1 2 3 4 5; do git fetch origin main; git rebase -X theirs origin/main; if git push origin HEAD:main; then exit 0; fi; git rebase --abort || true; sleep $((attempt * 3)); done
          exit 1
      - name: Verify main contains generated commit
        run: git fetch origin main && git merge-base --is-ancestor HEAD origin/main
      - name: Re-verify artifacts after rebase, before deploy
        run: |
          set -euo pipefail
          python validate_data_resilience.py --require-manifest
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare exact Pages site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --include='index.html' \
            --include='intelligence-web.html' \
            --include='site.webmanifest' \
            --include='favicon.png' \
            --include='apple-touch-icon.png' \
            --include='*.js' \
            --include='*.css' \
            --include='js/***' \
            --include='css/***' \
            --include='assets/***' \
            --include='data/***' \
            --exclude='*' \
            ./ _site/
          test -f _site/index.html
          test -f _site/data/map_points.json
          test -f _site/js/app.js
          test -f _site/intelligence-web.html
          test -f _site/intelligence_web_controls_fix.js
          test -f _site/global_pulse_performance.js
          test ! -e _site/news_feed.db
          test ! -e _site/tests
          test ! -e _site/.github
          ! find _site -type f -name '*.py' -print -quit | grep -q .
          ! find _site -type d -name '__pycache__' -print -quit | grep -q .
          python - <<'PY'
          import json
          from pathlib import Path
          mp=json.loads(Path('_site/data/map_points.json').read_text()); markers=mp.get('markers') or []; assert len(markers)>=10
          assert all(-90<=float(x['lat'])<=90 and -180<=float(x['lng'])<=180 for x in markers)
          brain=json.loads(Path('_site/data/intelligence_brain.json').read_text()); assert brain.get('complete') is True and brain.get('sourceBackedOnly') is True and brain.get('consolidated') is True; assert int(brain.get('maxNodes',0))==35 and 10<=len(brain.get('nodes',[]))<=35 and len(brain.get('edges',[]))>=5
          health=json.loads(Path('_site/data/source_health.json').read_text()); assert health.get('updatedAt') and int(health.get('feedsChecked',0))>=20 and int(health.get('rowsFetched',0))>0 and (health.get('sources') or [])
          canonical=json.loads(Path('_site/data/canonical_intelligence.json').read_text()); assert canonical.get('generated_at') and (canonical.get('entities') or []) and (canonical.get('evidence') or [])
          web=Path('_site/intelligence-web.html').read_text()
          for src in ('intelligence_web_runtime_guard.js?v=20260907-guard2','intelligence_web_performance.js?v=20260907-perf2','intelligence_web_v2.js?v=20260908-filters1','intelligence_web_controls_fix.js?v=20260907-controlsfix2','intelligence_action_flow.js?v=20260907-flow2'):
              assert src in web
          assert 'intelligence_semantic_layer.js' not in web
          print(f'PASS exact minimal Pages site: mapPoints={len(markers)} brainNodes={len(brain.get("nodes",[]))} sources={len(health.get("sources",[]))} canonicalEntities={len(canonical.get("entities",[]))}')
          PY
      - name: Upload exact generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy exact generated site
        id: deployment
        uses: actions/deploy-pages@v4
